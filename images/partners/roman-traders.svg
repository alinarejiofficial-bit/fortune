<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 180" role="img" aria-label="Roman Traders">
  <rect width="440" height="180" fill="#ffffff"/>
  <!-- double hairline frame -->
  <rect x="78" y="36" width="284" height="108" rx="2"
        fill="none" stroke="#1c1917" stroke-width="1.4"/>
  <rect x="86" y="44" width="268" height="92" rx="1"
        fill="none" stroke="#c4a35a" stroke-width="1"/>
  <text x="220" y="88" text-anchor="middle"
