        font-size="36" font-weight="700" fill="#1c1917"
        letter-spacing="6">ROMAN</text>
  <line x1="140" y1="102" x2="300" y2="102" stroke="#c4a35a" stroke-width="1.2"/>
  <text x="220" y="126" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
