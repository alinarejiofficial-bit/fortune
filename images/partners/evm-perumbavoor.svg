<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" role="img" aria-label="EVM Perumbavoor">
  <rect width="420" height="160" fill="#ffffff"/>
  <!-- split-tone EVM block matching chain blue -->
  <defs>
    <linearGradient id="evmBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4aa3e0"/>
      <stop offset="48%" stop-color="#4aa3e0"/>
      <stop offset="52%" stop-color="#143a6b"/>
      <stop offset="100%" stop-color="#143a6b"/>
    </linearGradient>
  </defs>
  <text x="210" y="78" text-anchor="middle"
        font-family="'Arial Black', 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="54" font-weight="900" fill="url(#evmBlue)"
        letter-spacing="2">evm</text>
  <text x="210" y="118" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="700" fill="#143a6b"
        letter-spacing="4">PERUMBAVOOR</text>
</svg>
